name: CI
on: [push]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm peers check
      - run: pnpm ignored-builds
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm test:server
      - run: pnpm test:component
      - run: pnpm test:design
      - run: pnpm test:audit
      - run: pnpm verify:font
      - run: pnpm build
      # The axe-core accessibility gate needs a built app and a real browser,
      # so it runs after the build and after the browser is provisioned.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec supabase start
      - name: Export Supabase environment
        run: |
          STATUS=$(pnpm exec supabase status -o json)
          echo "SUPABASE_URL=$(echo "$STATUS" | jq -r '.API_URL')" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r '.ANON_KEY')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r '.SERVICE_ROLE_KEY')" >> $GITHUB_ENV
          echo "BACKEND_BASE_URL=http://127.0.0.1:3000" >> $GITHUB_ENV
      - run: node scripts/seed-e2e-user.mjs
      - run: pnpm test:e2e
