name: CI
on: [push]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm peers check
      - run: pnpm ignored-builds
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm test:server
      - run: pnpm test:component
      - run: pnpm test:design
      - run: pnpm test:audit
      - run: pnpm verify:font
      - run: pnpm build
      # The axe-core accessibility gate needs a built app and a real browser,
      # so it runs after the build and after the browser is provisioned.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
